name: Release

on:
  release:
    types: [published]

jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release tag matches pyproject.toml version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          tag='${{ github.event.release.tag_name }}'
          if [ "$tag" != "v$version" ]; then
            echo "Release tag '$tag' does not match pyproject.toml version 'v$version'" >&2
            exit 1
          fi

  test:
    needs: check-tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package under test
        run: pip install -e .

      - name: Install test dependencies
        run: pip install pytest hypothesis

      # Same pinned versions as ci.yml so the release gate cannot drift
      # from the CI gate when a new tool version changes its findings
      - name: Install lint tools
        run: pip install ruff==0.14.10 mypy==1.19.1

      - name: Type check with mypy
        run: mypy src/

      - name: Lint with ruff
        run: ruff check src/ tests/ scripts/

      - name: Check formatting with ruff
        run: ruff format --check src/ tests/ scripts/

      - name: Install Perl stow for oracle tests
        run: |
          ./tests/get_gnu_stow_for_testing_identical_behavior.sh

      # The syscall-comparison layer skips without strace; CI must never
      # run in that degraded mode, so fail hard if strace is missing.
      - name: Ensure strace is available
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq strace
          strace --version

      - name: Run tests
        run: pytest tests/ -v

  attach-binaries:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build single-file executables
        run: python scripts/build_single_file.py

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            bin/stow \
            bin/chkstow \
            --clobber

  publish-pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # For trusted publishing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
