name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  download-stow:
    name: Download GNU Stow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache GNU Stow
        id: cache-stow
        uses: actions/cache@v4
        with:
          path: tests/gnu_stow_for_testing
          key: gnu-stow-2.4.1

      - name: Download and build GNU Stow
        if: steps.cache-stow.outputs.cache-hit != 'true'
        run: |
          cd tests
          ./get_gnu_stow_for_testing_identical_behavior.sh

      - name: Upload GNU Stow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnu-stow
          path: tests/gnu_stow_for_testing
          retention-days: 1

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: download-stow
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package under test
        run: pip install -e .

      - name: Install test dependencies
        run: pip install pytest hypothesis

      - name: Download GNU Stow artifact
        uses: actions/download-artifact@v4
        with:
          name: gnu-stow
          path: tests/gnu_stow_for_testing

      - name: Fix permissions
        run: chmod +x tests/gnu_stow_for_testing/bin/*

      # The syscall-comparison layer skips without strace; Linux CI must never
      # run in that degraded mode, so fail hard if strace is missing.
      - name: Ensure strace is available
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq strace
          strace --version

      - name: Run tests
        run: pytest tests/ -v

  test-macos:
    name: Test macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package under test
        run: pip install -e .

      - name: Install test dependencies
        run: pip install pytest hypothesis

      # The oracle build script uses GNU sed's -i syntax; put GNU sed
      # first in PATH so the same script works unchanged on macOS.
      - name: Install GNU sed
        run: |
          brew install gnu-sed
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Download and build GNU Stow
        run: |
          cd tests
          ./get_gnu_stow_for_testing_identical_behavior.sh

      # No strace exists on macOS: the harness still runs all non-syscall
      # comparison layers and loudly skips only the syscall layer.
      - name: Run tests (without strace)
        run: pytest tests/ -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install ruff==0.14.10 mypy==1.19.1

      - name: Type check with mypy
        run: mypy src/

      - name: Lint with ruff
        run: ruff check src/ tests/ scripts/

      - name: Check formatting with ruff
        run: ruff format --check src/ tests/ scripts/

  docs:
    name: Validate Texinfo manual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install texinfo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq texinfo

      - name: Validate docs/stow.texi
        run: makeinfo --no-split -o /dev/null docs/stow.texi

  # Build the sdist and wheel on every push so MANIFEST or metadata
  # breakage surfaces here, not during an actual release.
  package:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check metadata
        run: twine check --strict dist/*
