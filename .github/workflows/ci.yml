name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  download-stow:
    name: Download GNU Stow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache GNU Stow
        id: cache-stow
        uses: actions/cache@v4
        with:
          path: tests/gnu_stow_for_testing
          key: gnu-stow-2.4.1

      - name: Download and build GNU Stow
        if: steps.cache-stow.outputs.cache-hit != 'true'
        run: |
          cd tests
          ./get_gnu_stow_for_testing_identical_behavior.sh

      - name: Upload GNU Stow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnu-stow
          path: tests/gnu_stow_for_testing
          retention-days: 1

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: download-stow
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest hypothesis

      - name: Download GNU Stow artifact
        uses: actions/download-artifact@v4
        with:
          name: gnu-stow
          path: tests/gnu_stow_for_testing

      - name: Fix permissions
        run: chmod +x tests/gnu_stow_for_testing/bin/*

      # The syscall-comparison layer skips without strace; CI must never
      # run in that degraded mode, so fail hard if strace is missing.
      - name: Ensure strace is available
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq strace
          strace --version

      - name: Run tests
        run: pytest tests/ -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install ruff mypy

      - name: Type check with mypy
        run: mypy src/stow_python/ --ignore-missing-imports

      - name: Lint with ruff
        run: ruff check src/stow_python/

      - name: Check formatting with ruff
        run: ruff format --check src/stow_python/
